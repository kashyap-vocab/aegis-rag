[project]
name = "aegis-rag"
version = "0.1.0"
description = "Hacathon for Mclaren SS - F1 "
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.11",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "pandas>=3.0.6",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "sentence-transformers[onnx]>=3.2",
    "structlog>=26.1.0",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
